[project]
name = "wjw"
version = "0.1.1"
description = "The Waldorf Jinonice Web..."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django",
    "django-bootstrap5",
    "django-phonenumber-field[phonenumbers]",
    "django-allauth",
    "pyjwt",
    "requests",
    "cryptography",
    "django-environ",
    "vokativ",
    "django-jazzmin",
    "django-import-export[all]",
    "gunicorn",
    "whitenoise",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "django-extensions",
    "pytest-django",
    "django-stubs",
    "django-types",
    "mypy",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "wjw.settings"


[tool.setuptools.packages.find]
include = ["wjw*", "main*", "prispevky*"]

[tool.autopep8]
max_line_length = 120

[tool.ruff]
line-length = 120

[tool.pycodestyle]
max-line-length = 120

#[tool.pyright]
#reportMissingTypeStubs = false
#venvPath = "."
#venv = ".venv"

[tool.basedpyright]
reportMissingTypeArgument = "none"
